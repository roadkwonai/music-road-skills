name: Music Road Skills Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: music-road-skills-release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name != 'push' || github.event.deleted != true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Run release gates
        run: |
          node --test tests/*.test.cjs skills/road-music-video-studio/scripts/test-guide-copy.cjs
          node skills/road-music-video-studio/scripts/test_studio_draft.mjs
          node skills/road-music-video-studio/scripts/test_works_ui.mjs
          node skills/road-music-video-studio/scripts/test_status_reference_ui.mjs
          node skills/road-music-video-studio/scripts/test_storage_ui.mjs
          python3 -B -m unittest discover -s skills/road-music-video-studio/scripts -p "test_*.py"
          python3 -B tests/studio_test.py
      - name: Validate version and release note
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api "repos/$GH_REPO/releases?per_page=100" --paginate --slurp > "$RUNNER_TEMP/releases.json"
          node scripts/release-version.cjs "$RELEASE_TAG" "$RUNNER_TEMP/releases.json" > "$RUNNER_TEMP/release.json"
      - name: Build checked artifact
        run: |
          python3 scripts/build-release.py
          cd dist
          sha256sum --check SHA256SUMS.txt
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          NOTE_PATH="$(node -p 'JSON.parse(require("node:fs").readFileSync(process.env.RUNNER_TEMP + "/release.json")).notePath')"
          TITLE="$(node -p 'JSON.parse(require("node:fs").readFileSync(process.env.RUNNER_TEMP + "/release.json")).title')"
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "$TITLE" --notes-file "$NOTE_PATH" "dist/MusicRoad-Skills-${RELEASE_TAG#v}.zip" dist/SHA256SUMS.txt
          gh release edit "$RELEASE_TAG" --draft=false --latest=true
