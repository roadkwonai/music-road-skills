<head>
<meta charset="utf-8">

<title>Showreel</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000}#wrap{transform-origin:0 0}#stage{position:relative;overflow:hidden;background:#101014;color:#fff;font-family:Paperlogy,sans-serif;font-kerning:normal;-webkit-font-smoothing:antialiased;word-break:keep-all}.cam,.top,.scene{position:absolute;inset:0}.scene{overflow:hidden}.film-caption{position:absolute;left:96px;right:96px;bottom:78px;min-height:112px;display:flex;align-items:center;justify-content:center;border-radius:18px;background:rgba(9,9,12,.66);text-align:center;white-space:pre-line;font-weight:800;line-height:1.24;letter-spacing:-.035em;text-shadow:0 3px 18px #000;pointer-events:none}.film-caption[hidden]{display:none}.film-spectrum{position:absolute;left:92px;bottom:34px;width:380px;height:88px;pointer-events:none}.film-now{position:absolute;left:92px;top:70px;width:760px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:32px;font-weight:700;letter-spacing:-.02em;text-shadow:0 2px 10px #000}.film-queue{position:absolute;right:92px;top:70px;width:480px;max-height:260px;overflow:hidden;margin:0;padding:0;list-style:none;text-align:right;font-size:32px;line-height:1.34;text-shadow:0 2px 10px #000}.film-queue li{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.film-channel{position:absolute;right:92px;bottom:48px;max-width:480px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:32px;font-weight:700;letter-spacing:.08em;text-shadow:0 2px 10px #000}.film-thumbnail{position:absolute;inset:0;z-index:10;width:1920px;height:1080px;object-fit:cover;pointer-events:none}.player{position:fixed;left:0;right:0;bottom:0;height:44px;display:flex;gap:12px;align-items:center;padding:0 12px;background:#111;color:#777;font:12px/1 Paperlogy,sans-serif}.player .scrub{flex:1}
.film-now,.film-channel,.film-queue{box-sizing:border-box;background:rgba(4,15,29,.72);border-radius:8px;padding:8px 14px}.film-now{width:max-content;max-width:760px}.film-spectrum{background:rgba(4,15,29,.56);border-radius:5px}
</style>
