<!doctype html>
<html lang="ko" data-road-music-ui>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f5f5">
<title>Road Music 완성 결과</title>
<link rel="stylesheet" href="/design.css?token=__DESIGN_TOKEN__">
</head>
<body>
<a class="skip-link" href="#main-content">본문으로 건너뛰기</a>
<main id="main-content" class="results-page" data-view="list" data-rm-guide-tools>
  <header class="page-heading project-strip">
    <div><h1>완성 결과</h1><p>현재 프로젝트에 등록된 완성 음원·영상·원가사·자막을 재생하거나 내려받습니다.</p></div>
    <div class="page-actions"><p id="projectStatus" class="project-status" role="status">준비 중…</p><a class="button secondary" id="resultsGuide" href="#"><svg class="rm-icon" aria-hidden="true" focusable="false"><use href="#rm-icon-book-open"></use></svg>완성 결과 사용 가이드</a><button id="copyPageGuide" class="button secondary" type="button" title="이 화면의 사용 가이드 Markdown 원문을 복사합니다"><svg class="rm-icon" aria-hidden="true" focusable="false"><use href="#rm-icon-document-duplicate"></use></svg>Markdown 복사</button></div>
  </header>
  <p id="pageCopyStatus" class="hint" role="status"></p><textarea id="pageCopyFallback" class="copy-fallback" aria-label="복사할 가이드 Markdown 원문" readonly hidden></textarea>
  <section id="complete-files" class="workflow-section">
    <div class="section-heading"><div><p class="section-kicker">완성 파일</p><h2>파일 확인과 다운로드</h2><p>입력 음원·스타일 샘플·중간 결과는 이 목록에 포함하지 않습니다. 등록된 파일만 표시합니다.</p></div><div class="page-actions"><button id="refreshResults" class="button secondary" type="button"><svg class="rm-icon" aria-hidden="true" focusable="false"><use href="#rm-icon-arrow-path"></use></svg>새 결과 확인</button><a id="downloadAll" class="button" href="#" hidden title="등록된 완성 영상·음원·원가사·자막을 원본 그대로 묶습니다"><svg class="rm-icon" aria-hidden="true" focusable="false"><use href="#rm-icon-arrow-down-tray"></use></svg>완성 파일 ZIP 받기</a></div></div>
    <div class="view-controls" role="group" aria-label="결과 보기 방식"><span>보기 방식 <span class="rm-help-wrap"><button class="rm-help" type="button" aria-label="결과 보기 방식 도움말" aria-expanded="false"><svg class="rm-icon" aria-hidden="true" focusable="false"><use href="#rm-icon-question-mark-circle"></use></svg></button><span class="rm-tooltip" role="tooltip">목록 보기는 파일을 빠르게 비교합니다. 크게 보기는 영상과 음원을 넓게 재생합니다.</span></span></span><button id="listView" class="button secondary" type="button" aria-pressed="true"><svg class="rm-icon" aria-hidden="true" focusable="false"><use href="#rm-icon-list-bullet"></use></svg>목록 보기</button><button id="largeView" class="button secondary" type="button" aria-pressed="false"><svg class="rm-icon" aria-hidden="true" focusable="false"><use href="#rm-icon-squares-2x2"></use></svg>크게 보기</button></div>
    <p id="resultSummary" class="hint" role="status"></p>
    <div id="emptyState" class="empty-state" hidden><h3>아직 등록된 완성 파일이 없습니다</h3><p>제작과 등록이 끝나면 이 페이지에 음원·영상·가사·자막이 표시됩니다.</p><a id="emptyStudioLink" class="button secondary" href="#">제작 설정으로 돌아가기</a></div>
    <p id="relatedFilesNotice" class="hint" role="status"></p><div id="resultGroups"></div>
  </section>
</main>
<script id="page-guide-source" type="application/json">__GUIDE_MARKDOWN__</script>
<script>__STUDIO_BOOTSTRAP__</script>
<script>
const boot=window.__STUDIO_BOOTSTRAP__, $=s=>document.querySelector(s);let state;
const uiIcon=name=>`<svg class="rm-icon" aria-hidden="true" focusable="false"><use href="#rm-icon-${name}"></use></svg>`;
document.addEventListener('play',event=>{if(event.target.matches('audio,video'))document.querySelectorAll('audio,video').forEach(media=>{if(media!==event.target)media.pause()})},true);
function esc(s){return String(s??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]))}
$('#copyPageGuide').onclick=async()=>{const source=JSON.parse(document.getElementById('page-guide-source').textContent);try{await navigator.clipboard.writeText(source);$('#pageCopyStatus').textContent='가이드 Markdown을 복사했습니다.'}catch{const field=$('#pageCopyFallback');field.hidden=false;field.value=source;field.focus();field.select();$('#pageCopyStatus').textContent='자동 복사를 허용하지 않아 원문을 선택했습니다. 직접 복사해 주세요.'}};
function pageUrl(path){return path+'?token='+encodeURIComponent(boot.token)}
function guideUrl(slug){return '/guide/'+slug+'/?token='+encodeURIComponent(boot.token)}
function fileSize(bytes){if(!Number.isFinite(bytes))return '용량 정보 없음';return new Intl.NumberFormat('ko-KR',{maximumFractionDigits:1}).format(bytes>=1048576?bytes/1048576:Math.ceil(bytes/1024))+(bytes>=1048576?' MB':' KB')}
function sourceLabel(status){return status==='current'?'현재 원음과 일치':status==='different-source'?'다른 원음의 결과':'원음 확인 필요'}
function kindLabel(item,group){if(group==='captions'){const ext=(item.name||'').split('.').pop().toUpperCase();return ['SRT','VTT','ASS','LRC'].includes(ext)?ext+' 자막':'자막 파일'}return group==='lyrics'?'원가사':group==='audios'?'완성 음원':'완성 영상'}
async function api(path){try{const r=await fetch(path+(path.includes('?')?'&':'?')+'token='+encodeURIComponent(boot.token),{signal:AbortSignal.timeout(30000)});const data=await r.json();if(!r.ok)throw Error(data.error||'결과를 불러오지 못했습니다');return data}catch(error){if(['AbortError','TimeoutError'].includes(error.name))throw Error('결과 확인 시간이 초과되었습니다. 잠시 후 다시 시도하세요.');if(error.name==='TypeError')throw Error('제작실에 연결할 수 없습니다. 연결을 확인한 뒤 다시 시도하세요.');throw error}}
function download(item,label){return `<a class="button secondary download-link" href="${esc(item.downloadUrl||item.url+'&download=1')}" download="${esc(item.name)}" aria-label="${esc(label+' 다운로드 · '+item.name)}">${uiIcon('arrow-down-tray')}다운로드</a>`}
function audioBody(item){return `<audio controls preload="metadata" aria-label="${esc(item.name)} 재생" src="${esc(item.url)}"></audio>`}
function videoBody(item){return `<details class="play-details"><summary>재생 펼치기</summary><video controls playsinline preload="metadata" aria-label="${esc(item.name)} 재생" src="${esc(item.url)}"></video></details>`}
function lyricsBody(item){return typeof item.text==='string'?`<details class="play-details"><summary>원가사 보기</summary><pre class="lyrics-text" tabindex="0" aria-label="${esc(item.name)} 원문">${esc(item.text)}</pre></details>`:'<p class="hint">원문 미리보기를 불러오지 못했습니다. 파일을 내려받아 확인하세요.</p>'}
function card(item,group){const body=group==='audios'?audioBody(item):group==='videos'?videoBody(item):group==='lyrics'?lyricsBody(item):'';const label=kindLabel(item,group);return `<article class="result-file" data-kind="${group}"><div class="file-meta"><span class="file-kind">${esc(label)}</span><strong>${esc(item.name)}</strong><small>${esc(fileSize(item.size))} · ${esc(sourceLabel(item.sourceStatus))}</small></div><div class="file-body">${body}</div><div class="file-actions">${download(item,label)}</div></article>`}
function group(title,id,items,description){if(!items.length)return '';return `<section id="${id}" class="result-group"><div class="group-heading"><div><h2>${title}</h2><p>${description}</p></div></div><div class="result-list">${items.map(item=>card(item,id)).join('')}</div></section>`}
function render(){const review=state.media.review||{},groups={audios:review.audios||[],videos:review.videos||[],lyrics:review.lyrics||[],captions:review.captions||[]};const total=Object.values(groups).reduce((n,items)=>n+items.length,0);$('#relatedFilesNotice').textContent=groups.videos.length?(!groups.lyrics.length?'원가사가 등록되지 않았습니다. ':'')+(!groups.captions.some(item=>/\.srt$/i.test(item.name))?'SRT가 등록되지 않았습니다. ':'')+'등록된 프로젝트 가사·자막은 아래에서 각각 받거나 ZIP으로 함께 받을 수 있습니다.':'';$('#projectStatus').textContent=state.projectName+' · 등록된 완성 파일 '+new Intl.NumberFormat('ko-KR').format(total)+'개';$('#resultsGuide').href=guideUrl('results');$('#emptyStudioLink').href=pageUrl('/');$('#resultSummary').textContent=`완성 음원 ${groups.audios.length}개 · 영상 ${groups.videos.length}개 · 원가사 ${groups.lyrics.length}개 · 자막 ${groups.captions.length}개`;$('#emptyState').hidden=Boolean(total);$('#resultGroups').hidden=!total;$('#resultGroups').innerHTML=group('완성 영상','videos',groups.videos,'영상 옆에서 프로젝트 가사와 자막을 함께 확인할 수 있습니다.')+group('완성 음원','audios',groups.audios,'완성 결과로 등록된 음원만 표시합니다.')+group('원가사','lyrics',groups.lyrics,'가사 원문은 줄바꿈을 유지해 표시합니다.')+group('자막','captions',groups.captions,'등록된 자막 형식을 그대로 표시합니다. SRT와 LRC를 바꾸지 않습니다.');const related=[groups.lyrics.length?'<a class="text-link" href="#lyrics">프로젝트 가사</a>':'',groups.captions.length?'<a class="text-link" href="#captions">자막</a>':''].join('');if(related)document.querySelectorAll('#videos .result-file').forEach(el=>el.querySelector('.file-actions').insertAdjacentHTML('afterbegin',related));const all=$('#downloadAll');all.href=pageUrl('/downloads/complete.zip');all.hidden=!total;bindHelp();}
function setView(view){const next=view==='large'?'large':'list';document.querySelector('main').dataset.view=next;document.querySelectorAll('.play-details').forEach(details=>{details.open=next==='large'});$('#listView').setAttribute('aria-pressed',String(next==='list'));$('#largeView').setAttribute('aria-pressed',String(next==='large'));const url=new URL(location.href);url.searchParams.set('view',next);history.replaceState(null,'',url);try{sessionStorage.setItem('road-music-results-view:'+boot.token,next)}catch{}}
function bindHelp(){document.querySelectorAll('.rm-help').forEach((button,index)=>{const wrap=button.closest('.rm-help-wrap'),tip=wrap?.querySelector('.rm-tooltip');if(!tip)return;tip.id=tip.id||'page-help-'+index;button.setAttribute('aria-describedby',tip.id);const open=()=>{document.querySelectorAll('.rm-help[aria-expanded=true]').forEach(other=>other.setAttribute('aria-expanded','false'));button.setAttribute('aria-expanded','true');const box=button.getBoundingClientRect(),width=Math.min(280,innerWidth-32);tip.style.width=width+'px';tip.style.left=Math.max(16,Math.min(box.left,innerWidth-width-16))+'px';tip.style.top=Math.max(16,Math.min(box.bottom+8,innerHeight-tip.offsetHeight-16))+'px';};button.onclick=open;button.onfocus=open;button.onblur=()=>button.setAttribute('aria-expanded','false');wrap.onpointerenter=event=>{if(event.pointerType==='mouse')open()};wrap.onpointerleave=event=>{if(event.pointerType==='mouse'&&document.activeElement!==button)button.setAttribute('aria-expanded','false')};});}
document.addEventListener('click',event=>{if(!event.target.closest('.rm-help-wrap'))document.querySelectorAll('.rm-help[aria-expanded=true]').forEach(button=>button.setAttribute('aria-expanded','false'))});
document.addEventListener('keydown',event=>{if(event.key==='Escape')document.querySelectorAll('.rm-help[aria-expanded=true]').forEach(item=>item.setAttribute('aria-expanded','false'))});
$('#listView').onclick=()=>setView('list');$('#largeView').onclick=()=>setView('large');$('#refreshResults').onclick=async()=>{const button=$('#refreshResults');if(button.disabled)return;button.disabled=true;$('#resultSummary').textContent='새 결과 확인 중…';try{state=await api('/api/state');render();setView(document.querySelector('main').dataset.view);$('#resultSummary').classList.remove('message-error');$('#resultSummary').textContent+=' · 새 결과를 확인했습니다.'}catch(error){$('#resultSummary').textContent='새 결과를 확인하지 못했습니다. '+error.message;$('#resultSummary').classList.add('message-error')}finally{button.disabled=false}};
api('/api/state').then(data=>{state=data;const url=new URL(location.href);let saved='list';try{saved=sessionStorage.getItem('road-music-results-view:'+boot.token)||'list'}catch{}render();setView(url.searchParams.get('view')||saved||'list')}).catch(error=>{$('#projectStatus').textContent=error.message;$('#resultSummary').textContent='완성 결과를 불러오지 못했습니다. '+error.message;$('#resultSummary').classList.add('message-error')});
</script>
</body>
</html>
